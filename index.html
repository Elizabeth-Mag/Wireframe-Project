<!DOCTYPE html>
<html>
    <head>
        <title>Final Project</title>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />    
	    <link href="CSS/Master.css" rel="stylesheet" type="text/css" />
        <script src="JavaScript/Main.js"></script>
    </head>
    <body>
        <div class="controls">
            <a href="home.html"><button class="btn">Back Home</button></a>
            <button class="btn" onclick="updateGrid(4, 4)">4x4 Grid</button>
            <button class="btn" onclick="updateGrid(6, 3)">6x3 Grid</button>
            <button class="btn" onclick="updateGrid(12, 6)">12x6 Grid</button>
            <button class="btn" onclick="updateGrid(9, 16)">9x16 Grid</button>
            <button class="btn" onclick="updateGrid(10, 16)">10x16 Grid</button>
        </div>
        <div id="grid-container" ondrop="dropHandler(event)" ondragover="dragoverHandler(event)" ondragstart="dragstartHandler2(event)"></div>
        <br>
        <div class="tool-list">
            <img id="img1" src="images/text-placeholder.png" draggable="true" ondragstart="dragstartHandler(event)" width="52" height="52">
            <img id="img2" src="images/img-palceholder.png" draggable="true" ondragstart="dragstartHandler(event)" width="52" height="52">
            <div id="edittext" contenteditable="true" draggable="true" ondragstart="dragstartHandler(event)" width="52" height="52">Edit Text</div>
            <div id="edittext2" contenteditable="true" draggable="true" ondragstart="dragstartHandler(event);TextDragStart()" width="52" height="52">Edit Text</div> 
            <div id="textsizer" ><label id="sizer">Text Width:<input type=number min=0 step=1 name=textwidth></label> </div>
        </div>
    </body>
</html>
